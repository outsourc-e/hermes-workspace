# Hermes Workspace — Development Overlay
#
# The base Compose file already builds Workspace from local source. This
# optional overlay gives iterative builds a distinct local development tag.
#
# The Hermes Agent service still uses the canonical upstream image
# (the immutable digest pinned in docker-compose.yml) — there is no need to
# rebuild that locally, and doing so just couples the compose stack to
# whatever vendored Python the workspace happens to ship. If you really
# need a custom agent image, build/tag it separately and override the
# `image:` field in your own .override.yml.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# The base build context and private topology networking remain unchanged.

services:
  hermes-workspace:
    image: hermes-workspace:development
