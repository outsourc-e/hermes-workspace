# Secrets scanning CI
# Scans for leaked secrets on PR and push to main

name: Security Scan

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  secrets-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Grep for common patterns (fallback)
        if: always()
        run: |
          echo "🔍 Scanning for common secret patterns..."

          PATTERNS=(
            "sk-[a-zA-Z0-9]{20,}"
            "sk-ant-"
            "ghp_[a-zA-Z0-9]{36}"
            "github_pat_"
            "gho_[a-zA-Z0-9]{36}"
            "PRIVATE KEY"
            "-----BEGIN RSA"
            "-----BEGIN OPENSSH"
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -rE "$pattern" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" --include="*.env*" . 2>/dev/null \
              | grep -v node_modules \
              | grep -v ".lock" \
              | grep -v dist \
              | grep -v "test-redaction" \
              | grep -v "diagnostics.ts" \
              | grep -v "placeholder" \
              | grep -v "# pragma: allowlist secret" \
              | grep -v "example\|sample\|fake\|dummy\|test\|mock" ; then
              echo "::warning::Potential secret found matching: $pattern"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 1 ]; then
            echo "❌ Potential secrets detected! Please review and remove."
            exit 1
          fi

          echo "✅ No obvious secret patterns found"

      - name: Summary
        if: always()
        run: |
          {
            echo "## 🔒 Security Scan Result"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            if [ $FOUND -eq 1 ]; then
              echo "| Gitleaks + grep | ⚠️ Issues found |"
            else
              echo "| Gitleaks + grep | ✅ Clean |"
            fi
            echo ""
            echo "Scanned for: API keys, SSH keys, GitHub tokens, and other credential patterns."
          } >> "$GITHUB_STEP_SUMMARY"
