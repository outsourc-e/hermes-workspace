# Phase 2.5-002: Build + lint workflow
# Runs on PRs and pushes to main, production, and picknik-fixes

name: CI

on:
  push:
    branches: [main, production, picknik-fixes]
  pull_request:
    branches: [main, production, picknik-fixes]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint || echo "⚠️ Lint not configured, skipping"
        continue-on-error: true

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Regenerate checked-in Electron server bundle
        run: |
          pnpm electron:bundle-server
          cp electron/server-bundle.cjs "$RUNNER_TEMP/server-bundle.cjs"

      - name: Verify Electron server bundle is deterministic
        run: |
          pnpm electron:bundle-server
          cmp --silent "$RUNNER_TEMP/server-bundle.cjs" electron/server-bundle.cjs

      - name: Verify checked-in Electron server bundle is current
        run: git diff --exit-code -- electron/server-bundle.cjs

      - name: Verify build output
        run: |
          if [ -d "dist" ]; then
            echo "✅ Build output exists"
            ls -la dist/
          else
            echo "❌ No dist folder found"
            exit 1
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Run session topology adapter tests
        run: python -m unittest discover -s session-topology-adapter/tests -v

      - name: Verify pinned Hermes Agent persistence compatibility
        run: python session-topology-adapter/tests/verify_producer_compatibility.py

      - name: Verify reviewed Workspace source candidate
        run: python session-topology-adapter/tests/verify_workspace_source_candidate.py

      - name: Validate Docker Compose configuration
        env:
          SESSION_TOPOLOGY_ADAPTER_TOKEN: ci-compose-validation-placeholder
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build session topology adapter image
        run: docker build --tag session-topology-adapter:ci ./session-topology-adapter

      - name: Build reviewed Workspace candidate image
        env:
          SESSION_TOPOLOGY_ADAPTER_TOKEN: ci-compose-build-placeholder
        run: docker compose build hermes-workspace

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  package-portable:
    name: Package & Smoke Windows Portable
    runs-on: windows-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows portable package
        run: pnpm electron:package:portable

      - name: Smoke Windows portable package
        run: pnpm electron:smoke:portable
