# Hermes Workspace + Agent — Docker Compose Setup
#
# Requirements:
#   - Docker & Docker Compose
#   - At least one LLM provider key in .env (ANTHROPIC_API_KEY,
#     OPENAI_API_KEY, OPENROUTER_API_KEY, GOOGLE_API_KEY, …) OR a
#     reachable local server (Ollama, LM Studio, etc.)
#
# Quick Start:
#   1. cp .env.example .env
#   2. Generate a token with `openssl rand -hex 32` and set
#      SESSION_TOPOLOGY_ADAPTER_TOKEN in .env
#   3. Add at least one provider key (whichever you use)
#   4. docker compose up --build
#   5. Open http://localhost:3000
#
# Images:
#   Hermes Agent uses its reviewed immutable upstream image. Workspace and the
#   small Python-stdlib topology sidecar build from this checkout so the default
#   deployment runs the source candidate under review.
#     - nousresearch/hermes-agent@sha256:606a3b445ed7b963d63b1d96283e97c43c350eebf4f69abfb7fdfc3e2d7b7f56
#       (Hermes Agent v0.19.0, upstream revision fa7b0fcf5d6e3576a59514ef1e281cd1e0872b8b)
#     - hermes-workspace:reviewed-candidate (built from ./Dockerfile)
#
# Persistent data:
#   `hermes-agent-data` — agent config, sessions, skills, memory, credentials.
#     Mounted at /opt/data in the agent container, /home/workspace/.hermes in
#     the workspace container, and writable at /data in the topology adapter.
#     The adapter needs directory writes only for SQLite WAL/SHM coordination;
#     it opens database contents with mode=ro and PRAGMA query_only=ON.
#   `hermes-workspace-files` — files created from the Workspace file browser.
#   Both volumes survive container recreation and `docker compose down`.
#   Only `docker compose down -v` removes them.
#
# Troubleshooting:
#   - See README.md "Docker" troubleshooting section
#   - Check logs: docker compose logs hermes-agent
#   - Agent must expose port 8642

services:
  # The Hermes Agent gateway + dashboard APIs.
  # Gateway runs in the foreground on :8642. Dashboard runs as a background
  # process on :9119 and is reachable only on the private Docker network.
  hermes-agent:
    image: nousresearch/hermes-agent@sha256:606a3b445ed7b963d63b1d96283e97c43c350eebf4f69abfb7fdfc3e2d7b7f56
    restart: unless-stopped
    # The Hermes Agent image entrypoint defaults to the interactive CLI which exits
    # immediately under `docker compose up -d`. We override here to start the
    # gateway, which is the long-running API/health server the Workspace needs.
    # See #360.
    command: ["gateway", "run"]
    env_file:
      - .env
    environment:
      # Pass through whichever provider keys are set in .env. hermes-agent
      # uses the one that matches the provider configured in
      # ~/.hermes/config.yaml (or whatever `hermes setup` picked).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      HERMES_UID: '10010'
      HERMES_DASHBOARD: '1'
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_PORT: '9119'
      # Authentication for the gateway when exposing off-loopback.
      # In the default compose setup the gateway is reachable from the
      # workspace container over the docker network on hermes-agent:8642,
      # so an empty key works for localhost-only Docker installs. For any
      # deployment that publishes 8642 on the host or a LAN IP, set a
      # strong API_SERVER_KEY in .env — the workspace passes it through
      # as HERMES_API_TOKEN below. See #122.
      API_SERVER_KEY: ${API_SERVER_KEY:-}
      # Bind inside the container so the workspace can reach the gateway over
      # Docker DNS. The host publish below remains loopback-only.
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_ENABLED: 'true'
    volumes:
      - hermes-agent-data:/opt/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8642/health && curl -fsS http://localhost:9119/api/status || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - '127.0.0.1:8642:8642'

  # Read-only, authenticated projection of persisted session relationships.
  # This sidecar is private to the Compose network and does not publish a host port.
  session-topology-adapter:
    build:
      context: ./session-topology-adapter
    restart: unless-stopped
    user: '10010:10010'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      hermes-agent:
        condition: service_healthy
    environment:
      SESSION_TOPOLOGY_ADAPTER_TOKEN: ${SESSION_TOPOLOGY_ADAPTER_TOKEN:?SESSION_TOPOLOGY_ADAPTER_TOKEN must be set}
      SESSION_TOPOLOGY_ADAPTER_SNAPSHOT_TTL_SECONDS: ${SESSION_TOPOLOGY_ADAPTER_SNAPSHOT_TTL_SECONDS:-60}
      SESSION_TOPOLOGY_ADAPTER_MAX_SNAPSHOTS: ${SESSION_TOPOLOGY_ADAPTER_MAX_SNAPSHOTS:-32}
      SESSION_TOPOLOGY_ADAPTER_MAX_SNAPSHOT_ROWS: ${SESSION_TOPOLOGY_ADAPTER_MAX_SNAPSHOT_ROWS:-50000}
      SESSION_TOPOLOGY_ADAPTER_MAX_CONCURRENT_SNAPSHOTS: ${SESSION_TOPOLOGY_ADAPTER_MAX_CONCURRENT_SNAPSHOTS:-1}
      SESSION_TOPOLOGY_ADAPTER_MAX_CACHED_SNAPSHOT_ROWS: ${SESSION_TOPOLOGY_ADAPTER_MAX_CACHED_SNAPSHOT_ROWS:-100000}
      SESSION_TOPOLOGY_ADAPTER_MAX_CACHED_SNAPSHOT_BYTES: ${SESSION_TOPOLOGY_ADAPTER_MAX_CACHED_SNAPSHOT_BYTES:-67108864}
      SESSION_TOPOLOGY_ADAPTER_MAX_SCALAR_BYTES: ${SESSION_TOPOLOGY_ADAPTER_MAX_SCALAR_BYTES:-65536}
    volumes:
      - hermes-agent-data:/data
    networks:
      - session-topology-private
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # The Hermes Workspace Web UI
  # Connects to hermes-agent at http://hermes-agent:8642
  hermes-workspace:
    # Always rebuild the appropriately tagged local image from this checkout.
    # This prevents a stale registry or local image from receiving the private
    # adapter bearer token and shared agent-data mount.
    image: hermes-workspace:reviewed-candidate
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      hermes-agent:
        condition: service_healthy
      session-topology-adapter:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HERMES_HOME: /home/workspace/.hermes
      HERMES_WORKSPACE_DIR: /workspace
      # Internal Docker network URL (not localhost!)
      HERMES_API_URL: http://hermes-agent:8642
      HERMES_DASHBOARD_URL: http://hermes-agent:9119
      # Fixed private-network endpoint for a future server-side topology consumer.
      # This is intentionally not a browser-facing VITE_* variable or host override.
      SESSION_TOPOLOGY_ADAPTER_URL: http://session-topology-adapter:8080
      SESSION_TOPOLOGY_ADAPTER_TOKEN: ${SESSION_TOPOLOGY_ADAPTER_TOKEN:?SESSION_TOPOLOGY_ADAPTER_TOKEN must be set}
      # Must match API_SERVER_KEY on the hermes-agent side when that is set
      HERMES_API_TOKEN: ${API_SERVER_KEY:-}
      # Workspace session password. REQUIRED when HOST is non-loopback (the
      # default for Docker images, so the container binds 0.0.0.0:3000).
      # Pick a strong secret. See #122.
      # HERMES_PASSWORD is preferred; CLAUDE_PASSWORD remains as a back-compat
      # fallback for compose files that pre-date the rename.
      HERMES_PASSWORD: ${HERMES_PASSWORD:-${CLAUDE_PASSWORD:-}}
      # Enable the Secure flag on session cookies when terminated behind
      # HTTPS (reverse proxy / Tailscale Funnel / Cloudflare Tunnel). See #123.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Trust proxy-forwarded headers (x-forwarded-for / x-real-ip) for IP
      # classification. Leave unset unless you deploy behind a trusted proxy
      # that sanitizes these headers — otherwise a client can spoof its IP
      # and bypass local-classification / rate limiting. See #125.
      TRUST_PROXY: ${TRUST_PROXY:-}
    volumes:
      - hermes-agent-data:/home/workspace/.hermes
      - hermes-workspace-files:/workspace
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - default
      - session-topology-private

volumes:
  hermes-agent-data:
  hermes-workspace-files:

networks:
  default:
  session-topology-private:
    internal: true
