[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-langgraph-orchestrator"
version = "0.1.0"
description = "LangGraph orchestration brain for the Hermes Swarm workspace."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
hermes-langgraph = "hermes_langgraph_orchestrator.__main__:cli"

[tool.hatch.build.targets.wheel]
packages = ["."]
exclude = [".venv", ".pytest_cache", "tests", "bin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
