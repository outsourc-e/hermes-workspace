name: design_implement
version: 1
entry: architect
description: |
  Skip the research lane: architect designs first, developer implements,
  architect reviews (up to 3 rounds), then terminates on approval.

transitions:
  # Initial design with no build yet may approve without harden (no executor work).
  - from: architect
    "on":
      verdict: DONE
      review_outcome: approved
      metadata:
        harden_outcome: pass
    to: null
    reason: "Gate H pass / 设计通过且无需实现"

  - from: architect
    "on":
      verdict: DONE
      review_outcome: approved
      metadata:
        harden_outcome: fail
    to: developer
    max_iterations: 2
    reason: "Gate H: harden failed → developer revise (≤2)"

  # Gate C: review failed → developer revise ≤3, then Human Gate
  - from: architect
    "on":
      verdict: DONE
      review_outcome: changes_requested
    to: developer
    max_iterations: 3
    reason: "Gate C: code review failed → developer revise (≤3)"

  - from: architect
    "on":
      verdict: DONE
    to: developer
    reason: "设计完成，进入实现"

  - from: developer
    "on":
      verdict: DONE
    to: architect
    reason: "实现完成，交 architect 审查 + Harden"

blockers:
  escalate:
    - architecture_decision
    - missing_credential
  retry:
    - missing_dependency
    - test_failure
    - timeout

settings:
  max_iterations: 5
  terminal_docs: false
