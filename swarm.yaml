  - greenlight-gate
  - nexum-sequencing
  preferredTaskTypes:
  - orchestration
  - planning
  - routing
  - coordination
  - handoff
  - nexum-delivery
  greenlightRequiredFor:
  - merge
  - publish
  - destructive
  - external-send
  - credential-change
  maxConcurrentTasks: 1
  acceptsBroadcast: true
  plugins: []
  pluginToolsets: []
